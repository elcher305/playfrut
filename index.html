<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морской Бой</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<!-- Стартовый экран -->
<div id="startScreen" class="screen">
    <h1>Морской Бой</h1>
    <input id="playerName" type="text" placeholder="Введите имя">
    <button id="startGameBtn">Начать игру</button>
</div>

<!-- Экран игры -->
<div id="gameScreen" class="screen" style="display:none;">
    <div id="timerBlock">
        <span id="timer">00:00</span>
        <button id="pauseBtn">Пауза</button>
    </div>
    <div id="scoreBlock">
        <span id="score">Баллы: 0</span>
    </div>
    <div id="playerField"></div>
    <div id="enemyField"></div>
</div>

<!-- Экран окончания игры -->
<div id="endScreen" class="screen" style="display:none;">
    <h2 id="endMessage"></h2>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
